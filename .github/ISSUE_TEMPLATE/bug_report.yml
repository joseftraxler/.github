name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What happened?
          placeholder: Describe the issue
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: "1. …\n2. …\n3. …"
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          placeholder: What should have happened?
      validations:
          required: true

name: Feature request
description: Suggest a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem does this feature solve?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          placeholder: Describe your idea
      validations:
          required: true
